<!DOCTYPE html>
<!--
  Source for branding/og-image.png (1200x630, the link-preview picture used by Google Discover, WhatsApp,
  LinkedIn, X and Slack). Colours and fonts follow the site theme in styles.css.

  Regenerate (from the website folder, Edge installed):
    msedge --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 ^
      --virtual-time-budget=8000 --screenshot=branding/og-image.png file:///<full path>/scripts/seo/og-image.html
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Qelvix ERP preview image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
    color: #E8ECF2;
    background:
      radial-gradient(900px 520px at 88% 8%, rgba(45, 212, 191, 0.22), transparent 62%),
      radial-gradient(700px 480px at 0% 110%, rgba(45, 212, 191, 0.10), transparent 60%),
      #0A1019;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .tile {
    width: 84px; height: 84px; border-radius: 22px; background: #fff;
    display: grid; place-items: center; overflow: hidden;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.18); }
  .word { font-family: "Sora", "Manrope", sans-serif; font-weight: 600; font-size: 40px; color: #fff; letter-spacing: -0.01em; }
  .word span { color: #2DD4BF; margin-left: 10px; font-size: 40px; }
  h1 {
    font-family: "Sora", "Manrope", sans-serif; font-weight: 600; color: #fff;
    font-size: 78px; line-height: 1.08; letter-spacing: -0.02em; max-width: 980px;
  }
  h1 em { font-style: normal; color: #2DD4BF; }
  .sub { margin-top: 26px; font-size: 30px; line-height: 1.4; color: #B6C0CF; max-width: 940px; font-weight: 500; }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    font-weight: 600; font-size: 22px; color: #E8ECF2;
    border: 1.5px solid rgba(232, 236, 242, 0.28); border-radius: 999px; padding: 8px 20px;
  }
  .url { font-weight: 700; font-size: 26px; color: #2DD4BF; }
</style>
</head>
<body>
  <div class="brand">
    <div class="tile"><img src="../../branding/mark-light.png" alt=""></div>
    <div class="word">Qelvix<span>ERP</span></div>
  </div>
  <div>
    <h1>Your whole workshop, <em>one platform.</em></h1>
    <p class="sub">Job cards, live vehicle tracking, invoicing, inventory, payroll and accounting, all connected.</p>
  </div>
  <div class="foot">
    <div class="chips">
      <span class="chip">Job cards</span><span class="chip">Invoicing</span><span class="chip">Inventory</span><span class="chip">Payroll</span><span class="chip">Accounting</span>
    </div>
    <div class="url">www.qelvix.in</div>
  </div>
</body>
</html>
